<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0a2540" />
<title>Abrindo WhatsApp…</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'self'; connect-src 'none'" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0a2540; color: #f5f8f9; padding: 24px; text-align: center;
  }
  .card {
    max-width: 420px; width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px; padding: 28px 22px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 10px; font-weight: 700; }
  p { margin: 0 0 16px; color: #b9cbd8; font-size: .95rem; line-height: 1.5; }
  #preview {
    font-size: .85rem; color: #9fd9c0; background: rgba(31,184,119,.1);
    border: 1px dashed rgba(31,184,119,.35); border-radius: 12px;
    padding: 12px; margin-bottom: 18px; text-align: left; word-break: break-word;
  }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 14px 20px; border-radius: 12px;
    background: #25d366; color: #04101f; font-weight: 700;
    text-decoration: none; font-size: .95rem;
  }
  a.btn:hover { filter: brightness(1.05); }
  #err { color: #ffb4b4; margin-top: 12px; font-size: .9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Abrindo o WhatsApp…</h1>
    <p>Você será redirecionado para falar com João Carlos (indicação). Se não abrir sozinho, use o botão abaixo.</p>
    <div id="preview" aria-live="polite"></div>
    <a class="btn" id="go" href="https://wa.me/5511994105856" rel="noopener noreferrer">Continuar no WhatsApp</a>
    <p id="err" hidden>Não foi possível montar o link. Toque no botão verde.</p>
  </div>
  <script src="i.js"></script>
</body>
</html>
